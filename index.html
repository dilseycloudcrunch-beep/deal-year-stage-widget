<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> </title>
  <link rel="stylesheet" href="style.css">
  <!-- Zoho SDK -->
  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>Deal Year Stage View</h2>

    <!-- Year Dropdown Filter -->
    <div class="filter-section">
      <label for="yearSelect">Select Year: </label>
      <select id="yearSelect">
        <!-- Years will be populated dynamically via JS -->
      </select>
    </div>

    <!-- Stage Pills -->
    <div id="stagesContainer" class="stages-container">
      <p class="loading-text">Loading Deals...</p>
    </div>

    <!-- Deals List (shown only after clicking a stage) -->
    <div id="dealsPanel" class="deals-panel" style="display:none;">
      <div class="deals-panel-header">
        <span id="dealsPanelTitle"></span>
      </div>
      <div id="dealsList" class="deals-list"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
